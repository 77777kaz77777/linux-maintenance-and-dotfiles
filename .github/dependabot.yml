# dependabot.yml
version: 2
updates:
  # Update Node.js dependencies
  - package-ecosystem: "npm" 
    directory: "/" 
    schedule:
      interval: "weekly"
      
  # Update GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      
  # Example for Python dependencies (uncomment if needed)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
